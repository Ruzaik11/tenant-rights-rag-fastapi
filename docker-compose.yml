services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trh-postgres
    environment:
      POSTGRES_DB: tenant_rights
      POSTGRES_USER: trh_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TRH_API_PASSWORD: ${TRH_API_PASSWORD:?set TRH_API_PASSWORD in .env}
      TRH_INGEST_PASSWORD: ${TRH_INGEST_PASSWORD:?set TRH_INGEST_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trh_admin -d tenant_rights"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: